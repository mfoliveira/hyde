{{ define "main" -}}
<h2>Intro</h2>
This is the blog of Mauricio Faria de Oliveira on Linux adventures. 🐧

<h2>Blog</h2>
<div class="posts">
{{ range (where .Site.RegularPages "Section" "posts") -}}
<article class="">
  <h3 class="post-title">
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </h3>
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z0700" }}" class="post-date">{{ .Date.Format "02 Jan 2006" }}</time>
</article>
{{- end }}
</div>
{{- end }}
